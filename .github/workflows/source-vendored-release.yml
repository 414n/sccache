# Create a release source archive that is fully vendored so the consumer can build offline.
# Triggers on published releases and can also be run manually for testing.
name: Create vendored source archive

on:
  release:
    types: [published]
  workflow_dispatch: # optional: lets you run it manually to test
    inputs:
      tag_name:
        description: 'Release tag to create archive for'
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || github.event.inputs.tag_name }}
  SRCDIR: sccache-${{ github.event.release.tag_name || github.event.inputs.tag_name }}
  TAR: sccache-source-${{ github.event.release.tag_name || github.event.inputs.tag_name }}.tar.xz

jobs:
  vendor-and-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: ${{ env.SRCDIR }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Create vendor directory and .cargo config
        working-directory: ${{ env.SRCDIR }}
        run: |
          mkdir -p .cargo
          cargo vendor > .cargo/config.toml

      - name: Create tarball
        run: |
          tar --exclude="${{ env.SRCDIR }}/.git" \
            --exclude="${{ env.SRCDIR }}/target" \
            -cJvf "${{ env.TAR }}" \
            "${{ env.SRCDIR }}"
          echo "TAR=${{ env.TAR }}" >> $GITHUB_OUTPUT

      - name: Test offline build with vendored source tarball (--frozen option)
        run: |
          tmpdir=$(mktemp -d)
          srcdir="$tmpdir/src"
          build1dir="$tmpdir/build1"
          build2dir="$tmpdir/build2"
          trap 'rm -rf $tmpdir' EXIT
          mkdir -p "$srcdir" "$build1dir" "$build2dir"
          cd "$srcdir"
          tar xf "${{ github.workspace }}/${{ env.TAR }}"
          cd "${{ env.SRCDIR }}"
          CARGO_HOME="$build1dir" cargo build --release --frozen --features all
          # Also test dist-server feature specifically (if not in 'all')
          CARGO_HOME="$build2dir" cargo build --release --frozen --no-default-features --features dist-server

      - name: Upload tarball to the release
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ${{ env.TAR }}
          asset_name: ${{ env.TAR }}
          asset_content_type: application/x-xz-compressed-tar
