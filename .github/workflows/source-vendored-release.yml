# Create a release source archive that is fully vendored so the consumer can build offline.
# Triggers on published releases and can also be run manually for testing.
name: Create vendored source archive

on:
  release:
    types: [published]
  workflow_dispatch: # optional: lets you run it manually to test

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name }}
  SRCDIR: sccache-${{ github.event.release.tag_name }}
  TAR: sccache-source-${{ github.event.release.tag_name }}.tar
  TAR_XZ: sccache-source-${{ github.event.release.tag_name }}.tar.xz

jobs:
  vendor-and-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: ${{ env.SRCDIR }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Create vendor directory and .cargo config
        working-directory: ${{ env.SRCDIR }}
        run: |
          mkdir -p .cargo
          cargo vendor > .cargo/config.toml

      - name: Offline build test with vendored sources (--frozen option)
        working-directory: ${{ env.SRCDIR }}
        run: |
          cargo build --release --frozen

      - name: Create tarball
        run: |
          tar --exclude-vcs --exclude-vcs-ignore -cvf "${{ env.TAR }}" "${{ env.SRCDIR }}"
          tar -uvf "${{ env.TAR }}" "${{ env.SRCDIR }}"/.cargo
          xz -9ev "${{ env.TAR }}"
          echo "TAR_XZ=${{ env.TAR_XZ }}" >> $GITHUB_OUTPUT

      - name: Upload tarball to the release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ${{ env.TAR_XZ }}
          asset_name: ${{ env.TAR_XZ }}
          asset_content_type: application/x-xz-compressed-tar